name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint (fails CI on violations)
        run: ruff check . --output-format=github
      - name: Ruff format check (fails CI on unformatted code)
        run: ruff format --check .
